<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Arithmetic Operations</title>
    <style>
        body {
            background-image: url(https://cdn.pixabay.com/photo/2020/09/24/16/50/board-5599231_1280.png);
            background-repeat:no-repeat;
            background-size:cover;
            background-attachment: fixed;
            color:black;
            font-size: 20px;
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body>
    <center>
    <div style="margin: 100px; border: 20px solid #ffffff; background: #ffffff; padding: 20px; border-radius: 15px;">
        <h1>Calculator</h1>
        <form>
            <input type="number" id="num1" placeholder="Enter number"><br>
            <input type="number" id="num2" placeholder="Enter number"><br>
            <input type="button" py-click="add_numbers" value="Add">
            <input type="button" py-click="subtract_numbers" value="Subtract"><br>
            <input type="button" py-click="multiply_numbers" value="Multiply">
            <input type="button" py-click="divide_numbers" value="Divide"><br>
            
        </form><br><br>
        <div id="result" style="color: rgb(27, 43, 16); font-size: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
            <py-script src="main.py"></py-script>
        </div><br>
    </div>
    </center>
</body>
</html>
